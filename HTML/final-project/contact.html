<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="dave gray" />
    <meta
      name="description"
      content="the Contact us part of dave gray's HTML Full Course for Beginners | Complete All-in-One Tutorial | 4 Hours"
    />

    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./css/style.css" type="text/css" />

    <title>Contact Us</title>
  </head>
  <body>
    <header>
      <h1>Contact Us</h1>

      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#about">About LTS</a></li>
          <li><a href="index.html#menu">Our menu</a></li>
          <li><a href="hours.html">Store Hours</a></li>
        </ul>
      </nav>

      <figure>
        <img
          src="./img/tacos_close_up_400x260.png"
          alt="tacos close up"
          title="tacos close up"
          height="260"
          width="400"
          loading="lazy"
        />
        <figcaption>Little Taco Shop Tacos</figcaption>
      </figure>

      <hr />
    </header>

    <main>
      <section>
        <h2>Our Contact Form</h2>

        <form action="https://httpbin.org/get" method="get">
          <fieldset>
            <legend>Send Us a Message</legend>

            <p>
              <label for="name">Name</label>
              <input
                type="text"
                placeholder="your name"
                id="name"
                name="name"
                required
              />
            </p>
            <p>
              <label for="email">Email</label>
              <input
                type="email"
                placeholder="your email"
                id="email"
                name="email"
                required
              />
            </p>
            <p>
              <label for="message">Your Message:</label>

              <br />

              <textarea
                placeholder="Type your message here"
                cols="32"
                rows="10"
                name="message"
                id="message"
                required
              ></textarea>
            </p>
          </fieldset>

          <button type="submit">send</button>
          <button type="reset">reset</button>
        </form>
      </section>

      <section>
        <h2>Our Location</h2>

        <address>
          555 Taco Temptation Lane, Suite T <br />
          Kansas City, MO 55555-5555
          
          <p>Phone: <a href="tel:555-555-5555">555-555-5555</a></p>
        </address>
      </section>
    </main>

    <footer>
      <a href="#">Back to Top</a>

      <hr />

      <p>Copyright &copy; The little Taco Shop</p>
    </footer>
  </body>
</html>
